name: Deploy minimal Telegram video player

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/deploy-mini-app.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: telegram-mini-app-pages
  cancel-in-progress: false

jobs:
  ensure-pages:
    runs-on: ubuntu-latest
    permissions:
      pages: write
    steps:
      - name: Enable GitHub Pages for workflow deployment
        uses: actions/github-script@v7
        with:
          script: |
            try {
              const result = await github.rest.repos.createPagesSite({
                owner: context.repo.owner,
                repo: context.repo.repo,
                build_type: "workflow"
              });
              core.info("GitHub Pages site created for workflow deployment.");
            } catch (error) {
              if (error.status === 409 || error.status === 422) {
                core.info("A Pages site may already exist; continuing to configure and deploy.");
              } else {
                throw error;
              }
            }

  deploy:
    needs: ensure-pages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload player site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site
      - name: Deploy player site
        id: deployment
        uses: actions/deploy-pages@v4
