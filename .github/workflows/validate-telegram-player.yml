name: Validate Telegram Video Player

on:
  push:
    branches: [main]
    paths:
      - "p/**"
      - "p2/**"
      - "p3/**"
      - "p4/**"
      - "tube-player/**"
      - "scripts/validate-telegram-player.mjs"
      - "scripts/test-virtual-player.mjs"
      - ".github/workflows/validate-telegram-player.yml"
  pull_request:
    branches: [main]
    paths:
      - "p/**"
      - "p2/**"
      - "p3/**"
      - "p4/**"
      - "tube-player/**"
      - "scripts/validate-telegram-player.mjs"
      - ".github/workflows/validate-telegram-player.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate player source
        run: node scripts/validate-telegram-player.mjs
      - name: Install Playwright
        run: npm install --no-save playwright
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run responsive browser tests
        run: node scripts/test-virtual-player.mjs
      - name: Upload browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: virtual-player-browser-screenshots
          path: browser-test-artifacts/
          if-no-files-found: ignore
