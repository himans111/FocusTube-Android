name: Validate Telegram Video Player

on:
  push:
    branches: [main]
    paths:
      - "tube-player/**"
      - "scripts/validate-telegram-player.mjs"
      - ".github/workflows/validate-telegram-player.yml"
  pull_request:
    branches: [main]
    paths:
      - "tube-player/**"
      - "scripts/validate-telegram-player.mjs"
      - ".github/workflows/validate-telegram-player.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate player
        run: node scripts/validate-telegram-player.mjs
