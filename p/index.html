<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="color-scheme" content="dark">
  <title>Video Player</title>
  <style>
    :root { color-scheme: dark; background: #000; }
    * { box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #000;
      color: #fff;
      overscroll-behavior: none;
      -webkit-tap-highlight-color: transparent;
    }
    body { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    #app {
      position: fixed;
      inset: 0;
      overflow: hidden;
      background: #000;
      touch-action: pan-y;
    }
    #workspace {
      position: absolute;
      inset: 0;
      background: #000;
      touch-action: pan-y;
    }
    #player-stage {
      position: fixed;
      left: 0;
      top: 0;
      width: min(100vw, 177.7778dvh);
      height: auto;
      max-height: none;
      min-height: 1px;
      aspect-ratio: 16 / 9;
      background: #000;
      overflow: visible;
      z-index: 2;
      transform: none;
      will-change: left, top, width, height;
    }
    #video-frame {
      position: relative;
      width: 100%;
      height: 100%;
      aspect-ratio: 16 / 9;
      overflow: hidden;
      background: #000;
    }
    /* YT.Player replaces #player with a direct iframe child. Style both
       the initial mount node and the iframe that the API inserts. */
    #player,
    #video-frame > iframe {
      position: absolute;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
      background: #000;
    }
    /* Telegram fullscreen fills the Mini App viewport. Keep the actual
       YouTube surface 16:9 and center it instead of stretching it to portrait. */
    /* Fullscreen the player box itself so the exit button stays inside it. */
    #player-stage.fullscreen,
    #player-stage:fullscreen,
    #player-stage:-webkit-full-screen {
      inset: 0 !important;
      left: 0 !important;
      top: 0 !important;
      width: 100vw !important;
      height: 100vh !important;
      height: 100dvh !important;
      max-height: none;
      aspect-ratio: auto;
      z-index: 2147483647;
      display: grid;
      place-items: center;
      padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px)
               env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
      box-sizing: border-box;
      transform: none;
      overflow: hidden;
      background: #000;
    }
    #player-stage.fullscreen #video-frame,
    #player-stage:fullscreen #video-frame,
    #player-stage:-webkit-full-screen #video-frame {
      width: min(100%, 177.7778dvh);
      height: auto;
      aspect-ratio: 16 / 9;
    }
    #player-stage.fullscreen #drag-strip,
    #player-stage:fullscreen #drag-strip,
    #player-stage:-webkit-full-screen #drag-strip {
      display: none;
    }
    #drag-strip {
      position: absolute;
      z-index: 4;
      top: 0;
      left: 0;
      right: 0;
      height: 18px;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding-top: 5px;
      touch-action: none;
      cursor: grab;
    }
    #drag-strip::after {
      content: "";
      display: block;
      width: 34px;
      height: 3px;
      border-radius: 99px;
      background: rgba(255,255,255,.22);
    }
    #player-stage.is-dragging { opacity: .94; }
    #player-stage.is-dragging #drag-strip { cursor: grabbing; }
    /* Let YouTube's own fullscreen control receive the tap.
       A parent overlay here can steal the native control's touch event. */
    #fullscreen-button {
      position: absolute;
      z-index: 5;
      right: 10px;
      bottom: max(10px, env(safe-area-inset-bottom));
      top: auto;
      transform: none;
      width: 48px;
      height: 48px;
      padding: 11px;
      border: 0;
      border-radius: 50%;
      color: #fff;
      background: rgba(0,0,0,.34);
      display: grid;
      place-items: center;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    #fullscreen-button:active { background: rgba(0,0,0,.62); }
    #fullscreen-button svg { width: 24px; height: 24px; display: block; }
    #sound-prompt {
      position: absolute;
      z-index: 6;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      border: 1px solid rgba(255,255,255,.22);
      border-radius: 999px;
      padding: 11px 16px;
      color: #fff;
      background: rgba(0,0,0,.82);
      font: 600 14px/1.2 system-ui, sans-serif;
      white-space: nowrap;
      cursor: pointer;
    }
    #sound-prompt[hidden] { display: none; }
    #status {
      position: fixed;
      left: 12px;
      right: 12px;
      bottom: max(12px, env(safe-area-inset-bottom));
      z-index: 11;
      text-align: center;
      color: rgba(255,255,255,.55);
      font-size: 11px;
      pointer-events: auto;
    }
    #status:empty { display: none; }
    @media (prefers-reduced-motion: no-preference) {
      #player-stage { transition: box-shadow .12s ease; }
    }
  </style>
</head>
<body>
  <main id="app" aria-label="Video player">
    <div id="workspace" aria-hidden="true"></div>
    <section id="player-stage" aria-label="YouTube video">
      <div id="video-frame">
        <div id="player"></div>
        <div id="drag-strip" aria-label="Hold and drag video"></div>
        <button id="fullscreen-button" type="button" aria-label="Enter fullscreen" title="Fullscreen">
          <svg id="fullscreen-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M8 3H3v5M16 3h5v5M3 16v5h5M21 16v5h-5"/>
            <path d="M8 8 3 3M16 8l5-5M8 16l-5 5M16 16l5 5"/>
          </svg>
        </button>
        <button id="sound-prompt" type="button" hidden>Tap to play with sound</button>
      </div>
    </section>
    <div id="status" role="status" aria-live="polite"></div>
  </main>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script>
    (() => {
      "use strict";

      const app = document.getElementById("app");
      const workspace = document.getElementById("workspace");
      const stage = document.getElementById("player-stage");
      const videoFrame = document.getElementById("video-frame");
      const fullscreenButton = document.getElementById("fullscreen-button");
      const fullscreenIcon = document.getElementById("fullscreen-icon");
      const soundPrompt = document.getElementById("sound-prompt");
      const status = document.getElementById("status");
      const dragStrip = document.getElementById("drag-strip");
      const telegram = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;

      let player = null;
      let payload = null;
      let fullscreen = false;
      let autoplayWasBlocked = false;
      let dragTimer = null;
      let dragState = null;
      let playerLeft = 0;
      let playerTop = 0;
      let landscapeLockState = "not-requested";

      function requestLandscapeOrientationFromTap() {
        const orientation = window.screen && window.screen.orientation;
        if (!orientation || typeof orientation.lock !== "function") {
          landscapeLockState = "unavailable";
          return Promise.resolve(false);
        }
        landscapeLockState = "pending";
        try {
          return Promise.resolve(orientation.lock("landscape")).then(() => {
            landscapeLockState = "locked";
            return true;
          }).catch(() => {
            landscapeLockState = "rejected";
            return false;
          });
        } catch (_) {
          landscapeLockState = "rejected";
          return Promise.resolve(false);
        }
      }

      function unlockPlayerOrientation() {
        try {
          if (window.screen && window.screen.orientation &&
              typeof window.screen.orientation.unlock === "function") {
            window.screen.orientation.unlock();
          }
        } catch (_) {}
        landscapeLockState = "not-requested";
      }

      function decode(value) {
        let result = String(value || "").trim();
        for (let i = 0; i < 2; i += 1) {
          try {
            const next = decodeURIComponent(result);
            if (next === result) break;
            result = next;
          } catch (_) { break; }
        }
        return result.trim();
      }

      function parseYouTube(value, depth = 0) {
        if (!value || depth > 3) return null;
        const raw = decode(value);

        if (/^pl_[\w-]+$/.test(raw)) return { kind: "playlist", id: raw.slice(3) };

        const prefixed = raw.match(/^(?:yt_|video_)(.+)$/i);
        if (prefixed) return parseYouTube(prefixed[1], depth + 1);

        if (/^[\w-]{11}$/.test(raw)) return { kind: "video", id: raw };

        let url;
        try {
          url = new URL(raw);
        } catch (_) {
          return null;
        }

        const host = url.hostname.replace(/^www\./, "").toLowerCase();
        if (host === "youtu.be") {
          const id = url.pathname.split("/").filter(Boolean)[0];
          if (id && /^[\w-]{11}$/.test(id)) return { kind: "video", id };
        }

        if (host === "t.me" || host === "telegram.me") {
          const nested = url.searchParams.get("startapp") || url.searchParams.get("start");
          if (nested) return parseYouTube(nested, depth + 1);
        }

        if (host === "youtube.com" || host === "m.youtube.com" || host === "youtube-nocookie.com") {
          const list = url.searchParams.get("list");
          const video = url.searchParams.get("v");
          if (video && /^[\w-]{11}$/.test(video)) return { kind: "video", id: video, list: list || null };
          if (list) return { kind: "playlist", id: list };
          const parts = url.pathname.split("/").filter(Boolean);
          const marker = parts.findIndex(part => ["shorts", "live", "embed", "v"].includes(part));
          if (marker >= 0 && parts[marker + 1] && /^[\w-]{11}$/.test(parts[marker + 1])) {
            return { kind: "video", id: parts[marker + 1] };
          }
        }

        return null;
      }

      function getLaunchPayload() {
        const query = new URLSearchParams(window.location.search);
        const hash = new URLSearchParams(window.location.hash.replace(/^#/, ""));
        const values = [
          telegram && telegram.initDataUnsafe ? telegram.initDataUnsafe.start_param : null,
          query.get("tgWebAppStartParam"),
          query.get("startapp"),
          query.get("video"),
          query.get("v"),
          hash.get("tgWebAppStartParam"),
          hash.get("startapp"),
          hash.get("video"),
          hash.get("v")
        ];
        for (const value of values) {
          const parsed = parseYouTube(value);
          if (parsed) return parsed;
        }
        return null;
      }

      function resizePlayerToFrame() {
        if (!player || typeof player.setSize !== "function" || !videoFrame) return;
        const rect = videoFrame.getBoundingClientRect();
        if (rect.width < 200 || rect.height < 200) return;
        player.setSize(Math.round(rect.width), Math.round(rect.height));
      }

      function schedulePlayerResize() {
        if (typeof window.requestAnimationFrame === "function") {
          window.requestAnimationFrame(resizePlayerToFrame);
        } else {
          resizePlayerToFrame();
        }
      }

      function setFullscreenUi(value) {
        fullscreen = Boolean(value);
        stage.classList.toggle("fullscreen", fullscreen);
        fullscreenButton.setAttribute("aria-label", fullscreen ? "Exit fullscreen" : "Enter fullscreen");
        fullscreenButton.title = fullscreen ? "Exit fullscreen" : "Fullscreen";
        fullscreenIcon.innerHTML = fullscreen
          ? '<path d="M8 3v5H3M16 3v5h5M3 16h5v5M21 16h-5v5"/>'
          : '<path d="M8 3H3v5M16 3h5v5M3 16v5h5M21 16v5h-5"/><path d="M8 8 3 3M16 8l5-5M8 16l-5 5M16 16l5 5"/>';
        playerLeft = 0;
        playerTop = 0;
        stage.style.left = "0px";
        stage.style.top = "0px";
        schedulePlayerResize();
      }

      function setStatus(message, showExternalVideo = false) {
        status.replaceChildren();
        if (!message) return;
        status.appendChild(document.createTextNode(message));
        if (!showExternalVideo || !payload) return;
        const link = document.createElement("a");
        link.target = "_blank";
        link.rel = "noopener noreferrer";
        link.style.color = "#fff";
        link.style.textDecoration = "underline";
        link.style.marginLeft = "8px";
        link.textContent = "YouTube में खोलें";
        link.href = payload.kind === "playlist"
          ? "https://www.youtube.com/playlist?list=" + encodeURIComponent(payload.id)
          : "https://www.youtube.com/watch?v=" + encodeURIComponent(payload.id);
        status.appendChild(link);
      }

      function requestTelegramFullscreenFallback(reason) {
        if (telegram && typeof telegram.requestFullscreen === "function" &&
            typeof telegram.isVersionAtLeast === "function" &&
            telegram.isVersionAtLeast("8.0")) {
          try {
            telegram.requestFullscreen();
            // Try orientation lock again after the host accepts fullscreen.
            requestLandscapeOrientationFromTap();
            setStatus(reason + " Telegram fullscreen fallback आज़माया जा रहा है।");
            return;
          } catch (_) {}
        }
        setStatus(reason, true);
      }

      function enterFullscreen() {
        if (fullscreen) {
          exitFullscreen();
          return;
        }

        setStatus("वीडियो fullscreen खोल रहे हैं…");

        // Fullscreen the player BOX, not just the document or the iframe.
        // This keeps our single fullscreen/exit button inside the fullscreen
        // surface. Both API requests are issued in the same user tap.
        if (typeof stage.requestFullscreen === "function") {
          let fullscreenRequest;
          try {
            fullscreenRequest = stage.requestFullscreen({ navigationUI: "hide" });
          } catch (error) {
            requestTelegramFullscreenFallback(
              "वीडियो बॉक्स fullscreen अस्वीकार हुआ (" +
              (error && error.name ? error.name : "error") + ")।"
            );
            return;
          }

          Promise.resolve(fullscreenRequest).then(() => {
            setFullscreenUi(true);
            // Orientation lock is requested only after the browser has
            // actually entered fullscreen; Android requires this ordering.
            return requestLandscapeOrientationFromTap();
          }).then(landscapeLocked => {
            if (!landscapeLocked && fullscreen) {
              setStatus("वीडियो fullscreen खुला है। इस WebView में Auto-rotate lock उपलब्ध नहीं है।");
            } else {
              setStatus("");
            }
          }).catch(error => {
            const name = error && error.name ? error.name : "NotAllowedError";
            requestTelegramFullscreenFallback(
              "Android WebView ने video-box fullscreen रोक दिया (" + name + ")।"
            );
          });
          return;
        }

        requestTelegramFullscreenFallback("इस WebView में browser fullscreen API उपलब्ध नहीं है।");
      }

      function exitFullscreen() {
        if (!fullscreen && !(telegram && telegram.isFullscreen) && !document.fullscreenElement) return;
        if (document.fullscreenElement && document.exitFullscreen) {
          document.exitFullscreen().catch(() => {});
        }
        if (telegram && typeof telegram.exitFullscreen === "function" && telegram.isFullscreen) {
          try { telegram.exitFullscreen(); } catch (_) {}
        }
        unlockPlayerOrientation();
        setFullscreenUi(false);
        setStatus("");
      }

      fullscreenButton.addEventListener("click", () => {
        if (fullscreen) exitFullscreen();
        else enterFullscreen();
      });

      if (telegram) {
        try {
          telegram.ready();
          telegram.expand();
          if (typeof telegram.setHeaderColor === "function") telegram.setHeaderColor("#000000");
          if (typeof telegram.setBackgroundColor === "function") telegram.setBackgroundColor("#000000");
        } catch (_) {}

        if (typeof telegram.onEvent === "function") {
          telegram.onEvent("fullscreenChanged", () => {
            const active = Boolean(telegram.isFullscreen) || document.fullscreenElement === stage;
            setFullscreenUi(active);
            if (active) {
              // Retry after Telegram confirms app fullscreen; orientation lock
              // can be rejected before the fullscreen state is actually active.
              requestLandscapeOrientationFromTap().then(landscapeLocked => {
                if (!landscapeLocked) {
                  setStatus("Fullscreen खुला है, लेकिन Telegram WebView ने landscape lock नहीं दिया।");
                } else {
                  setStatus("");
                }
              });
            } else {
              unlockPlayerOrientation();
              setStatus("");
            }
          });
          telegram.onEvent("fullscreenFailed", event => {
            setFullscreenUi(false);
            unlockPlayerOrientation();
            const reason = event && event.error ? event.error : "UNSUPPORTED";
            const reasonText = reason === "UNSUPPORTED"
              ? "Telegram Android ने Mini App fullscreen को unsupported बताया।"
              : reason === "ALREADY_FULLSCREEN"
                ? "Telegram पहले से fullscreen में है।"
                : "Telegram fullscreen request असफल हुई: " + reason;
            setStatus(reasonText, reason !== "ALREADY_FULLSCREEN");
          });
        }
      }

      // Direct Mini App links may request mode=fullscreen. Reflect the
      // state Telegram reports; never fake fullscreen before confirmation.
      if (telegram && telegram.isFullscreen) {
        setFullscreenUi(true);
        setStatus("");
      }

      document.addEventListener("fullscreenchange", () => {
        const active = document.fullscreenElement === stage || Boolean(telegram && telegram.isFullscreen);
        setFullscreenUi(active);
        if (!active) unlockPlayerOrientation();
      });

      function enableSound() {
        if (!player) return;
        autoplayWasBlocked = false;
        try {
          player.unMute();
          player.setVolume(100);
          player.playVideo();
        } catch (_) {}
        soundPrompt.hidden = true;
      }

      soundPrompt.addEventListener("click", enableSound);

      window.onYouTubeIframeAPIReady = function () {
        if (!payload) return;
        const playerVars = {
          autoplay: 1,
          controls: 1,
          // Keep YouTube's native fullscreen control enabled. Android WebView
          // handles this request differently from Mini App window expansion.
          fs: 0,
          playsinline: 1,
          rel: 0,
          modestbranding: 1,
          enablejsapi: 1,
          origin: window.location.origin,
          mute: 0
        };
        if (payload.kind === "playlist") {
          playerVars.listType = "playlist";
          playerVars.list = payload.id;
        } else if (payload.list) {
          playerVars.list = payload.list;
        }

        const initialFrame = videoFrame.getBoundingClientRect();
        const config = {
          width: Math.round(initialFrame.width),
          height: Math.round(initialFrame.height),
          playerVars,
          events: {
            onReady(event) {
              const iframe = event.target.getIframe();
              iframe.setAttribute("allow", "autoplay; encrypted-media; picture-in-picture; fullscreen; web-share");
              iframe.setAttribute("allowfullscreen", "");
              schedulePlayerResize();
              try {
                event.target.unMute();
                event.target.setVolume(100);
                event.target.playVideo();
              } catch (_) {}
            },
            onStateChange(event) {
              if (event.data === 1) {
                soundPrompt.hidden = true;
                autoplayWasBlocked = false;
              }
            },
            onAutoplayBlocked() {
              autoplayWasBlocked = true;
              soundPrompt.hidden = false;
            },
            onError() {
              setStatus("This YouTube video cannot be played here.", true);
            }
          }
        };

        if (payload.kind === "video") config.videoId = payload.id;
        player = new YT.Player("player", config);
      };

      function startPlayer() {
        payload = getLaunchPayload();
        if (!payload) {
          setStatus("");
          return;
        }
        const api = document.createElement("script");
        api.src = "https://www.youtube.com/iframe_api";
        api.async = true;
        document.head.appendChild(api);
      }

      // Long-press on the thin top edge of the video or on the empty black
      // workspace starts a drag. Short taps and normal YouTube controls are
      // left untouched. The cross-origin YouTube iframe cannot expose its
      // internal touch events to this page, so the edge is the safe drag grip.
      function beginHold(event, source) {
        if (fullscreen || event.button !== undefined && event.button !== 0) return;
        if (event.cancelable) event.preventDefault();
        clearTimeout(dragTimer);
        const rect = stage.getBoundingClientRect();
        dragState = {
          source,
          pointerId: event.pointerId,
          startX: event.clientX,
          startY: event.clientY,
          offsetX: rect.left - event.clientX,
          offsetY: rect.top - event.clientY,
          moved: false,
          active: false
        };
        dragTimer = window.setTimeout(() => {
          if (!dragState) return;
          dragState.active = true;
          stage.classList.add("is-dragging");
          if (source && source.setPointerCapture && event.pointerId !== undefined) {
            try { source.setPointerCapture(event.pointerId); } catch (_) {}
          }
        }, 430);
      }

      function moveHold(event) {
        if (!dragState) return;
        const dx = event.clientX - dragState.startX;
        const dy = event.clientY - dragState.startY;
        if (!dragState.active && Math.hypot(dx, dy) > 8) {
          clearTimeout(dragTimer);
          dragState = null;
          return;
        }
        if (!dragState.active) return;
        if (event.cancelable) event.preventDefault();
        const width = stage.getBoundingClientRect().width;
        const height = stage.getBoundingClientRect().height;
        const maxLeft = Math.max(0, window.innerWidth - width);
        const maxTop = Math.max(0, window.innerHeight - height);
        playerLeft = Math.min(maxLeft, Math.max(0, event.clientX + dragState.offsetX));
        playerTop = Math.min(maxTop, Math.max(0, event.clientY + dragState.offsetY));
        stage.style.left = playerLeft + "px";
        stage.style.top = playerTop + "px";
        dragState.moved = true;
      }

      function endHold() {
        clearTimeout(dragTimer);
        if (dragState && dragState.active) stage.classList.remove("is-dragging");
        dragState = null;
      }

      dragStrip.addEventListener("pointerdown", event => beginHold(event, dragStrip));
      workspace.addEventListener("pointerdown", event => beginHold(event, workspace));
      window.addEventListener("pointermove", moveHold, { passive: false });
      window.addEventListener("pointerup", endHold);
      window.addEventListener("pointercancel", endHold);
      window.addEventListener("resize", () => {
        if (!fullscreen) {
          const maxLeft = Math.max(0, window.innerWidth - stage.getBoundingClientRect().width);
          const maxTop = Math.max(0, window.innerHeight - stage.getBoundingClientRect().height);
          playerLeft = Math.min(playerLeft, maxLeft);
          playerTop = Math.min(playerTop, maxTop);
          stage.style.left = playerLeft + "px";
          stage.style.top = playerTop + "px";
        }
        schedulePlayerResize();
      });
      window.addEventListener("orientationchange", schedulePlayerResize);

      startPlayer();
    })();
  </script>
</body>
</html>
