<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>Video Player</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 100%; min-height: 100%; background: #000; color: #fff; }
  body { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  #stage { width: 100%; max-width: 760px; margin: 0 auto; aspect-ratio: 16 / 9; background: #000; position: relative; overflow: hidden; }
  #player { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; display: block; background: #000; }
  #notice { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; flex-direction: column; gap: 8px; padding: 16px; text-align: center; font-size: 14px; color: #ddd; }
  #notice a { display: inline-block; color: #fff; text-decoration: none; background: #272727; border: 1px solid #444; border-radius: 8px; padding: 8px 12px; }
</style>
</head>
<body>
<div id="stage">
  <iframe id="player"
    title="YouTube video player"
    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
    allowfullscreen
    referrerpolicy="strict-origin-when-cross-origin"></iframe>
  <div id="notice"><span id="noticeText">वीडियो लिंक में ID नहीं मिली।</span><a id="ytLink" href="https://www.youtube.com/" target="_blank" rel="noopener">YouTube पर खोलें ↗</a></div>
</div>
<script>
(() => {
  const tg = window.Telegram && window.Telegram.WebApp;
  try { if (tg) { tg.ready(); tg.expand(); } } catch (_) {}

  const qs = new URLSearchParams(location.search);
  const hs = new URLSearchParams(String(location.hash || "").replace(/^#/, ""));
  const notice = document.getElementById("notice");
  const noticeText = document.getElementById("noticeText");
  const ytLink = document.getElementById("ytLink");
  const player = document.getElementById("player");

  function decode(value) {
    let s = String(value || "").trim();
    for (let i = 0; i < 2; i++) {
      try { const d = decodeURIComponent(s); if (d === s) break; s = d; } catch (_) { break; }
    }
    return s.trim();
  }

  function parseVideo(value) {
    const raw = decode(value);
    if (!raw) return null;

    // Payload supports a video ID, a playlist ID prefixed with pl_, or a full YouTube URL.
    if (raw.startsWith("pl_") && /^[A-Za-z0-9_-]{10,200}$/.test(raw.slice(3))) return { type: "playlist", id: raw.slice(3) };
    if (/^[A-Za-z0-9_-]{11}$/.test(raw)) return { type: "video", id: raw };
    if (raw.startsWith("yt_") && /^[A-Za-z0-9_-]{11}$/.test(raw.slice(3))) return { type: "video", id: raw.slice(3) };
    if (raw.startsWith("video_") && /^[A-Za-z0-9_-]{11}$/.test(raw.slice(6))) return { type: "video", id: raw.slice(6) };

    let u;
    try { u = new URL(/^[a-z][a-z0-9+.-]*:\/\//i.test(raw) ? raw : "https://" + raw); }
    catch (_) { return null; }
    const host = u.hostname.toLowerCase().replace(/^(www|m|music)\./, "");
    if (host === "youtu.be") {
      const id = u.pathname.split("/").filter(Boolean)[0];
      return /^[A-Za-z0-9_-]{11}$/.test(id || "") ? { type: "video", id } : null;
    }
    if (host === "youtube.com" || host === "youtube-nocookie.com") {
      const path = u.pathname.split("/").filter(Boolean);
      const playlist = u.searchParams.get("list") || "";
      if (path[0] === "playlist" && /^[A-Za-z0-9_-]{10,200}$/.test(playlist)) return { type: "playlist", id: playlist };
      const id = u.searchParams.get("v") || (["shorts", "live", "embed", "v"].includes(path[0]) ? path[1] : "");
      if (/^[A-Za-z0-9_-]{11}$/.test(id || "")) return { type: "video", id };
      if (/^[A-Za-z0-9_-]{10,200}$/.test(playlist)) return { type: "playlist", id: playlist };
    }
    return null;
  }

  function getPayload() {
    try {
      const start = tg && tg.initDataUnsafe && tg.initDataUnsafe.start_param;
      if (start) return start;
    } catch (_) {}
    const keys = ["tgWebAppStartParam", "startapp", "video", "v", "url"];
    for (const key of keys) {
      if (qs.get(key)) return qs.get(key);
      if (hs.get(key)) return hs.get(key);
    }
    try {
      const init = new URLSearchParams((tg && tg.initData) || "");
      if (init.get("start_param")) return init.get("start_param");
    } catch (_) {}
    return "";
  }

  const item = parseVideo(getPayload());
  if (!item) {
    player.style.display = "none";
    notice.style.display = "flex";
    return;
  }
  if (item.type === "playlist") {
    ytLink.href = "https://www.youtube.com/playlist?list=" + encodeURIComponent(item.id);
    player.src = "https://www.youtube-nocookie.com/embed/videoseries?list=" + encodeURIComponent(item.id) + "&autoplay=1&playsinline=1&rel=0";
  } else {
    ytLink.href = "https://www.youtube.com/watch?v=" + encodeURIComponent(item.id);
    player.src = "https://www.youtube-nocookie.com/embed/" + encodeURIComponent(item.id) + "?autoplay=1&playsinline=1&rel=0&modestbranding=1";
  }
})();
</script>
</body>
</html>
